<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>WOF ONE</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px 36px;
    width: 320px;
    text-align: center;
  }
  .card h1 {
    font-size: 18px;
    margin: 0 0 6px;
    color: #1f2430;
  }
  .card p {
    font-size: 13px;
    color: #7a8296;
    margin: 0 0 24px;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 22px;
    letter-spacing: 6px;
    text-align: center;
    padding: 12px 8px;
    border: 1px solid #d9dce3;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #2f6feb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #2559c4; }
  #error {
    color: #d9364f;
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>WOF ONE</h1>
    <p>Enter the current access code to continue.</p>
    <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>
    <button id="enterBtn">Enter</button>
    <div id="error"></div>
  </div>

  <script src="totp.js"></script>
  <script>
    const input = document.getElementById("codeInput");
    const btn = document.getElementById("enterBtn");
    const errorEl = document.getElementById("error");

    // Session length is intentionally separate from the code's own
    // rotation clock (set in totp.js) — the two can be changed independently.
    const SESSION_VALIDITY_MS = 86400000; // 24 hours

    async function attemptEntry() {
      errorEl.textContent = "";
      const valid = await isCodeValid(input.value);
      if (valid) {
        sessionStorage.setItem("wofOneGateGrantedAt", Date.now().toString());
        window.location.href = "course/index.html";
      } else {
        errorEl.textContent = "Incorrect or expired code. Please try again.";
        input.value = "";
        input.focus();
      }
    }

    btn.addEventListener("click", attemptEntry);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptEntry();
    });

    // If a still-valid pass exists this session, skip straight through.
    const grantedAt = parseInt(sessionStorage.getItem("wofOneGateGrantedAt") || "0", 10);
    if (grantedAt && (Date.now() - grantedAt) < SESSION_VALIDITY_MS) {
      window.location.href = "course/index.html";
    } else {
      sessionStorage.removeItem("wofOneGateGrantedAt");
    }
  </script>
</body>
</html>
